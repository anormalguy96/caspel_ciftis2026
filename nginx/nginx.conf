########################################################################
# CASPEL CIFTIS 2026 — container nginx
#
# Serves the built SPA and proxies /api to the FastAPI container. It runs
# behind the host vhost in deploy/nginx/caspel-ciftis.conf, which owns TLS,
# HSTS and CSP — so none of that is repeated here.
########################################################################

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml application/wasm;

    server {
        listen 80;
        server_name _;

        client_max_body_size 32M;

        root /usr/share/nginx/html;
        index index.html;

        # Defence in depth; the host vhost sets the full policy including CSP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # No redirect here. The SPA is mounted at this container root in both
        # deployment modes: for a dedicated subdomain the host proxies "/"
        # straight through, and for the corporate path mode the host strips the
        # external "/ciftis" prefix exactly once before forwarding. Anything
        # this container adds would be a second, conflicting opinion about the
        # public path.

        # index.html must never be cached so visitors always receive references
        # to the current deployment's content-hashed JS/CSS assets.
        #
        # The three security headers are repeated deliberately. nginx does not
        # merge add_header sets: a location that declares any add_header of its
        # own discards every one inherited from the server block. Because the
        # SPA fallback below internally rewrites every deep link to
        # /index.html, omitting them here would strip X-Frame-Options from
        # every HTML document the site serves — the one response class where
        # clickjacking protection actually matters. Any header added at server
        # level must be added here too.
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Hashed filenames — safe to cache indefinitely.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /fonts/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # PDFs are served by the API (/api/presentations/{slug}/stream), which
        # verifies each file against its approved SHA256. There is deliberately
        # no direct filesystem alias for them here.
        #
        # The old filename-addressed route bypassed that verification and is
        # gone. Without this rule the SPA fallback below answers /presentations/
        # with index.html, so a .pdf URL returns an HTML page and the route
        # looks alive. It is not — say so.
        location /presentations/ {
            return 404;
        }

        # Server-sent events. The parent /api/ block already disables
        # buffering, but it does so for range requests -- a reason that could
        # reasonably be revisited. Streaming has its own requirements, so it
        # states them itself rather than inheriting them by coincidence.
        location = /api/chat/stream {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # A buffered stream is not a stream: nginx would collect the whole
            # body and deliver it as one late response.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            # gzip buffers to reach its compression window, which reintroduces
            # exactly the latency streaming exists to remove.
            gzip off;

            # Chunked, not length-prefixed.
            chunked_transfer_encoding on;

            # A long answer may legitimately outlast the standard read window;
            # heartbeats keep the connection from idling out inside it.
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;

            # OVERWRITE, never append. $proxy_add_x_forwarded_for prepends
            # whatever the client sent, so a caller could put any address in
            # front of their own and mint a fresh rate-limit bucket per
            # request. This hop is the trust boundary: only the address nginx
            # actually saw is passed on, and the backend is configured for
            # exactly one trusted proxy (TRUSTED_PROXY_COUNT=1).
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Range requests must stream through untouched.
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Legacy /ciftis compatibility is deliberately NOT handled here.
        #
        # This container is prefix-agnostic: it serves the SPA at its own root
        # in both deployment modes, and the public prefix is owned entirely by
        # the host vhost. A redirect from /ciftis to / at this layer is correct
        # for the subdomain and actively harmful for the corporate subpath: if
        # the prefix ever reaches this container, the browser is sent to
        # https://caspel.com/display, which the corporate site does not serve.
        # Worse, server_name here is "_", so nginx builds the Location from the
        # inbound Host header and a plain "return 301 /" answers an HTTPS
        # visitor with http://caspel.com/ -- a scheme downgrade the container
        # cannot see it is causing.
        #
        # The compatibility rules therefore live with the vhost that knows the
        # public path: deploy/nginx/caspel-ciftis.conf for Mode A and
        # deploy/nginx/caspel-com-ciftis-snippet.conf for Mode B.

        # SPA fallback for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 50x.html ships in the frontend build; without it this directive
        # would itself 404 during an outage.
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
