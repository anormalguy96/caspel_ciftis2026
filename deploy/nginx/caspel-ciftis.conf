########################################################################
# CASPEL CIFTIS 2026 — production vhost
#
# Runs on the Linux host and terminates TLS. Everything behind it is the
# MODE A — dedicated subdomain. Complete, independent virtual host for
# ciftis.caspel.com. Requires its own DNS record and a certificate covering
# that hostname. For MODE B (https://caspel.com/ciftis/) do NOT install this
# file; use deploy/nginx/caspel-com-ciftis-snippet.conf instead.
#
# Docker Compose stack listening on 127.0.0.1:8080 (never on a public
# interface), which serves the built SPA and proxies /api to FastAPI.
#
# Install:
#   sudo cp deploy/nginx/caspel-ciftis.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/caspel-ciftis.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every occurrence of ciftis.caspel.com with the real hostname.
########################################################################

# Rate limiting, applied per client IP. The application enforces its own
# limits too; this is the cheap outer layer that never reaches Python.
limit_req_zone $binary_remote_addr zone=caspel_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=caspel_general:10m rate=120r/m;

# --- HTTP: redirect everything to HTTPS (document.md §30) --------------
server {
    listen 80;
    listen [::]:80;
    server_name ciftis.caspel.com;

    # Leave this reachable over HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ciftis.caspel.com;

    ssl_certificate     /etc/letsencrypt/live/ciftis.caspel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciftis.caspel.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ciftis.caspel.com/chain.pem;

    # --- Security headers ---------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # CSP notes:
    #   worker-src blob:      the bundled pdf.js worker
    #   wasm-unsafe-eval      pdf.js image decoders
    #   style-src unsafe-inline  React sets a few style attributes
    #                            (progress widths, animation delays)
    # No external origins appear anywhere: every asset is served from here,
    # which is what keeps the page working inside China (document.md §24).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The 24 MB corporate deck must not be truncated on upload/replacement.
    client_max_body_size 32M;

    # Exhibition Wi-Fi can be slow; give a phone time to finish a range request.
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/wasm;

    # Enable if ngx_brotli is available — better ratios on the JS bundles.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/caspel-ciftis.access.log;
    error_log  /var/log/nginx/caspel-ciftis.error.log warn;


    # --- Legacy /ciftis compatibility (Mode A only) -------------------
    #
    # Anything printed, bookmarked or shared while the hub was expected to
    # live at caspel.com/ciftis keeps working on the subdomain, where the
    # canonical path has no prefix. This belongs here rather than in the
    # shared container config: only a vhost knows its own public path, and
    # the same rule inside the container would break the corporate subpath
    # deployment by sending /ciftis/display to /display on caspel.com.
    #
    # 302, not 301: the public URL is still undecided, and a permanent
    # redirect is cached by browsers long after the decision changes.
    #
    # absolute_redirect off keeps the Location relative, so the response
    # cannot invent a scheme. An absolute redirect built from $scheme would
    # answer http:// whenever TLS terminates at an upstream load balancer.
    location = /ciftis {
        absolute_redirect off;
        return 302 /;
    }

    location = /ciftis/ {
        absolute_redirect off;
        return 302 /;
    }

    # The query string is preserved automatically: nginx appends the original
    # arguments whenever the replacement contains no "?" of its own. Adding
    # $is_args$args here as well produces /product/erp?a=1?a=1.
    location /ciftis/ {
        absolute_redirect off;
        rewrite ^/ciftis/(.*)$ /$1 redirect;
    }

    # --- API ----------------------------------------------------------
    location /api/ {
        limit_req zone=caspel_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Presentation streaming relies on byte ranges; buffering the whole
        # 24 MB file in nginx before forwarding would defeat that entirely.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- Hashed build assets: immutable ------------------------------
    location /assets/ {
        limit_req zone=caspel_general burst=100 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;

        # Filenames contain a content hash, so a year is safe and means a
        # returning visitor re-downloads nothing (document.md §23).
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- Everything else: the SPA ------------------------------------
    location / {
        limit_req zone=caspel_general burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
