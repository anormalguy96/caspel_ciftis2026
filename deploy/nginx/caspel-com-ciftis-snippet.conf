########################################################################
# CASPEL CIFTIS 2026 — path mode integration snippet
#
# FOR MODE B ONLY: the hub served beneath the existing corporate website at
#
#     https://caspel.com/ciftis/
#
# This file is NOT a virtual host and must not be installed as one. It contains
# only location blocks, to be merged by CASPEL infrastructure staff into the
# EXISTING `server { server_name caspel.com; ... }` block that already serves
# the corporate site.
#
# Installing a second competing `server_name caspel.com` vhost would make nginx
# pick one of them non-deterministically and could take the corporate website
# offline. Do not do that. Merge these locations, or `include` this file from
# inside the existing server block:
#
#     server {
#         server_name caspel.com;
#         ...existing corporate site config...
#         include /etc/nginx/snippets/caspel-com-ciftis.conf;
#     }
#
# Prerequisites
#   * the existing caspel.com DNS record and TLS certificate are reused —
#     no new DNS and no new certificate are required for this mode;
#   * access to the corporate reverse proxy configuration is required;
#   * the compose stack is listening on 127.0.0.1:8080 (loopback only);
#   * the frontend image was built with
#       VITE_APP_BASE_PATH=/ciftis/
#       VITE_PUBLIC_URL=https://caspel.com/ciftis
#     A bundle built for the subdomain mode will NOT work here: its asset and
#     API URLs would resolve to the corporate site root.
########################################################################

# Canonical trailing slash. Without this, a visitor typing /ciftis gets a page
# whose relative asset URLs resolve one level too high.
#
# absolute_redirect off makes nginx answer with a relative "Location: /ciftis/"
# instead of rebuilding an absolute URL from $scheme, server_name and the
# listening port. That rebuild is wrong in two deployments this snippet has to
# survive: where TLS terminates at an upstream load balancer, corporate nginx
# sees $scheme=http and would downgrade the visitor to plain HTTP; and on a
# plain-HTTP validation host reached by address, it would send the tester to
# the live corporate domain instead of the server under test. A relative
# Location is resolved by the client against the URL it actually requested, so
# it stays correct under direct TLS, upstream TLS and plain HTTP alike. Scoped
# to this one location so no other corporate route changes behaviour.
# 302 rather than 301 while the public URL is still undecided. A permanent
# redirect is cached by browsers and would outlive a change of mode.
location = /ciftis {
    absolute_redirect off;
    return 302 /ciftis/;
}

location /ciftis/ {
    # The trailing slash on BOTH the location and proxy_pass is what strips the
    # external "/ciftis" prefix exactly once: /ciftis/api/health reaches the
    # container as /api/health. The container is prefix-agnostic and serves the
    # SPA at its own root, so the prefix must be removed here and nowhere else.
    # Query strings are preserved automatically by this form.
    proxy_pass http://127.0.0.1:8080/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Tells the app which public prefix it is mounted under, for anything that
    # needs to know at the HTTP layer. The bundle itself already knows: the
    # value was baked in at build time.
    proxy_set_header X-Forwarded-Prefix /ciftis;

    # Byte-range PDF streaming must pass through untouched, or the 24 MB
    # corporate deck is buffered whole before a visitor sees page one.
    proxy_buffering         off;
    proxy_request_buffering off;

    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # SPA deep links (/ciftis/product/erp, /ciftis/presentation/caspel) are
    # resolved by the container's own try_files fallback to index.html, so no
    # extra rule is needed here. /ciftis/assets/…, /ciftis/api/… and
    # /ciftis/presentations/… all reach the container with the prefix removed
    # and are handled by its matching location blocks.
}
