services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caspel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ciftis}
      POSTGRES_USER: ${POSTGRES_USER:-ciftis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciftis_secret_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciftis} -d ${POSTGRES_DB:-ciftis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caspel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-ciftis}
      POSTGRES_USER: ${POSTGRES_USER:-ciftis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciftis_secret_password_2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ciftis}:${POSTGRES_PASSWORD:-ciftis_secret_password_2026}@postgres:5432/${POSTGRES_DB:-ciftis}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.0-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
    volumes:
      - ./data/presentations:/data/presentations:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caspel_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/presentations:/usr/share/nginx/html/presentations:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ciftis || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
