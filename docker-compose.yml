services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caspel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      # No default. A shared fallback password in source control is how a
      # development credential ends up on a production host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published on the host. The database is reachable only from the
    # compose network; use `docker compose exec postgres psql` for admin work.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caspel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      # Selected by environment, never by the application. Switching model or
      # key needs only a .env change plus `docker compose up -d backend`.
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}

      # Answering architecture. "rag" is production; "full_context" is the
      # experimental arm. Server-owned: the browser cannot select it, and an
      # unrecognised value fails startup validation rather than falling back.
      AI_CONTEXT_MODE: ${AI_CONTEXT_MODE:-rag}

      # Server-sent streaming for /api/chat/stream. Off by default: a streamed
      # answer that fails after the first token cannot become a 503, so it is
      # enabled per deployment once verified behind that deployment proxy.
      AI_STREAMING_ENABLED: ${AI_STREAMING_ENABLED:-false}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Exactly one proxy (the nginx container) sits in front of the app.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
    volumes:
      # Read-only: the API serves these decks and must never modify them.
      - ./data/presentations:/data/presentations:ro
    # expose, not ports: the backend is reachable only from the compose
    # network. Publishing 8000 would put an unproxied API on the host.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Deployment mode. "/" for a dedicated subdomain, "/ciftis/" when the
        # hub is served beneath the corporate site. Both are baked in at build
        # time; the build fails on a mismatched or unsafe value.
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:?VITE_PUBLIC_URL is required}
        VITE_DISPLAY_RESET_SECONDS: ${VITE_DISPLAY_RESET_SECONDS:-25}
    container_name: caspel_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bound to loopback only: the host nginx vhost terminates TLS and is the
      # sole public entry point. Publishing on 0.0.0.0 would expose plain HTTP.
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # The SPA is served at the container root in both deployment modes; any
      # public prefix is added by the host proxy, so probing a prefixed path
      # here would 404 and mark a healthy container unhealthy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
