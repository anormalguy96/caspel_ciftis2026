<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASPEL — Temporarily unavailable</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Self-contained: during an outage the CSS bundle may not be reachable. */
      :root {
        --dark: #063044;
        --green: #51b748;
        --muted: #96b0be;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--dark);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main { max-width: 34rem; }
      .eyebrow {
        margin-bottom: 16px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--green);
      }
      h1 {
        margin-bottom: 12px;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p { color: var(--muted); font-size: 16px; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        border-radius: 12px;
        background-color: var(--green);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CASPEL · CIFTIS 2026</p>
      <h1>This page is temporarily unavailable</h1>
      <p>
        We are restoring the service. Please try again in a moment, or speak with
        our team at the CASPEL stand.
      </p>
      <a href="/ciftis">Try again</a>
    </main>
  </body>
</html>
